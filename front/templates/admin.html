<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぬまコン - 管理者画面</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin-body">
    <div class="admin-pc-wrapper">
        <header class="admin-pc-header">
            <div class="admin-header-left">
                <h2>ぬまコン 管理者メニュー</h2>
            </div>
            <a href="/" class="back-btn" style="text-decoration: none;">← 一般画面へ戻る</a>
        </header>

        <div class="admin-pc-body">
            <!-- 左側：タブメニュー -->
            <aside class="admin-sidebar">
                <p class="sidebar-group-title">情報の追加</p>
                <button type="button" class="admin-tab-btn active" data-target="tab-add-doc">
                    <span class="material-symbols-outlined">post_add</span>
                    行政資料を追加
                </button>
                <button type="button" class="admin-tab-btn" data-target="tab-add-notice">
                    <span class="material-symbols-outlined">edit_note</span>
                    回覧板を追加
                </button>

                <p class="sidebar-group-title" style="margin-top: 24px;">データの管理</p>
                <button type="button" class="admin-tab-btn" data-target="tab-list-doc">
                    <span class="material-symbols-outlined">folder_open</span>
                    行政資料の一覧・削除
                </button>
                <button type="button" class="admin-tab-btn" data-target="tab-list-notice">
                    <span class="material-symbols-outlined">list_alt</span>
                    回覧板の一覧・削除
                </button>
            </aside>

            <!-- 右側：切り替え表示エリア -->
            <main class="admin-main-panel">

                <!-- ① 行政資料を追加 -->
                <section id="tab-add-doc" class="admin-tab-content active">
                    <h3>📚 新しい行政資料を追加</h3>
                    <form id="docForm" class="admin-pc-form">
                        <div class="form-row">
                            <div class="form-col">
                                <label for="docTitle">タイトル</label>
                                <input type="text" id="docTitle" placeholder="例：令和8年度 住民税のお知らせ" required>
                            </div>
                            <div class="form-col" style="max-width: 280px;">
                                <label for="docCategory">カテゴリー</label>
                                <select id="docCategory" required>
                                    <option value="広報誌">広報誌</option>
                                    <option value="手続き・制度">手続き・制度</option>
                                    <option value="イベント">イベント</option>
                                    <option value="その他">その他</option>
                                </select>
                            </div>
                        </div>

                        <label for="docContent">内容（プレーンテキスト）</label>
                        <textarea id="docContent" rows="5" placeholder="テキストのみの追加・補足説明はこちら"></textarea>

                        <div class="form-row">
                            <div class="form-col">
                                <label for="docFile">添付ファイル（最大20MB）</label>
                                <input type="file" id="docFile" accept=".pdf,image/*">
                            </div>
                            <div class="form-col">
                                <label for="docSchedule">対象日程（イベント等）</label>
                                <input type="date" id="docSchedule" class="pc-date-input">
                            </div>
                            <div class="form-col">
                                <label for="docPublish">公開日</label>
                                <input type="date" id="docPublish" class="pc-date-input">
                            </div>
                        </div>

                        <div class="admin-form-buttons">
                            <button type="submit" style="background-color: #d1f7f9;">行政資料を登録する</button>
                        </div>
                    </form>
                </section>

                <!-- ② 回覧板を追加・編集 -->
                <section id="tab-add-notice" class="admin-tab-content" style="display: none;">
                    <h3 id="adminFormHeading">📋 新しい回覧板を追加</h3>
                    <form id="noticeForm" class="admin-pc-form">
                        <input type="hidden" id="noticeId">

                        <div class="form-row">
                            <div class="form-col" style="max-width: 240px;">
                                <label for="noticeType">種類</label>
                                <select id="noticeType" required>
                                    <option value="お知らせ">お知らせ</option>
                                    <option value="イベント">イベント</option>
                                </select>
                            </div>
                            <div class="form-col">
                                <label for="noticeTitleInput">タイトル</label>
                                <input type="text" id="noticeTitleInput" maxlength="100" placeholder="タイトルを入力" required>
                            </div>
                        </div>

                        <label for="noticeContentInput">本文</label>
                        <textarea id="noticeContentInput" rows="6" placeholder="お知らせの内容を入力" required></textarea>

                        <div class="form-row">
                            <div class="form-col">
                                <label for="noticePhotoInput">写真（任意・最大8MB）</label>
                                <input type="file" id="noticePhotoInput" accept="image/*">
                                <p class="admin-help">写真はなくても登録できます。</p>
                            </div>
                            <div class="form-col" style="max-width: 260px;">
                                <label for="noticePublishInput">公開日</label>
                                <input type="date" id="noticePublishInput" class="pc-date-input" required>
                            </div>
                        </div>
                        
                        <div id="photoPreviewArea" class="photo-preview-area" style="display: none;">
                            <img id="photoPreview" alt="写真のプレビュー">
                            <button type="button" id="removePhotoBtn">写真を外す</button>
                        </div>

                        <div class="admin-form-buttons">
                            <button type="submit" id="saveNoticeBtn" style="background-color: #d1f7f9;">回覧板を登録する</button>
                            <button type="button" id="cancelEditBtn" style="display: none;">編集をキャンセル</button>
                        </div>
                    </form>
                </section>

                <!-- ③ 行政資料の一覧・削除 -->
                <section id="tab-list-doc" class="admin-tab-content" style="display: none;">
                    <h3>🗂️ 登録済みの行政資料一覧</h3>
                    <div id="adminDocList" class="admin-notice-list"></div>
                </section>

                <!-- ④ 回覧板の一覧・削除 -->
                <section id="tab-list-notice" class="admin-tab-content" style="display: none;">
                    <h3>🗑️ 登録済みの回覧板一覧</h3>
                    <div id="adminNoticeList" class="admin-notice-list"></div>
                </section>

            </main>
        </div>
    </div>
    <script src="/static/admin.js"></script>
</body>
</html>
